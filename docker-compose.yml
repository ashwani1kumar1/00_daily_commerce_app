version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: local_services_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: local_services_pg
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: local_services_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: local_services_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongodata:
  pgdata:
